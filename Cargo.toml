[workspace]
exclude = ["fixtures/*"]
members = ["test_hook", "macro"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/smoelius/test_hook"
version = "0.1.0"

[workspace.dependencies]
test_hook_macro = { version = "=0.1.0", path = "macro" }

[[workspace.metadata.dylint.libraries]]
git = "https://github.com/trailofbits/dylint"
pattern = [
    "examples/general",
    "examples/supplementary",
    "examples/restriction/inconsistent_qualification",
    "examples/restriction/non_topologically_sorted_functions",
]
